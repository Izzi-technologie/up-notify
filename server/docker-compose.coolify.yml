services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      ALARM_TOKEN: ${ALARM_TOKEN:-}
      APK_PATH: ${APK_PATH:-/apk/WebhookAlarm-TV-release.apk}
    volumes:
      - apk:/apk
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  apk:
